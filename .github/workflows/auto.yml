name: Auto Sync & Keepalive

# 本仓库唯一的定时入口，做四件事：
#   1) 同步上游 hezhanleiok/gate —— 对方代码更新后自动跟进（check.yml 保持上游原版，不在此改动）
#   2) 保活 —— 每 20 天以内至少产生一次提交，避免 GitHub 因 60 天无活动停掉定时任务
#   3) 触发 VPN Gate Node Check（真正的抓取/检测逻辑在 check.yml + vpngate.py）
#   4) 三轮并集 —— 等 check 跑完，把它本轮结果与已发布的最近两轮合并，逐个回测剔除失效，再二次发布

on:
  schedule:
    # 每小时一次（UTC，偏移到 :17 避开整点高峰）。实测：单节点判定稳定 96%，而源站候选名单约 20 分钟就轮换一遍，
    # 所以加密到 30 分钟并不提高可用性，只是换一批样本；1 小时是性价比拐点。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 同步上游代码
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/hezhanleiok/gate.git 2>/dev/null || true
          git fetch --no-tags upstream main
          if git merge --no-edit -X ours upstream/main >/dev/null 2>&1; then
            echo "上游 HEAD: $(git rev-parse --short upstream/main)"
            echo "合并完成，当前 HEAD: $(git rev-parse --short HEAD)"
          else
            echo "::warning::上游合并冲突，已放弃本次合并并保留本仓库版本"
            git merge --abort || true
          fi

      - name: 保活检查
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          last=$(cat .keepalive 2>/dev/null || echo 0)
          case "$last" in ''|*[!0-9]*) last=0 ;; esac
          age=$(( (now - last) / 86400 ))
          echo "距上次保活提交 ${age} 天（阈值 20 天）"
          if [ "$age" -ge 20 ]; then
            echo "$now" > .keepalive
            git add .keepalive
            git commit -m "chore: keepalive $(date -u +%F)"
            echo "已生成保活提交"
          else
            echo "尚不需要保活提交"
          fi

      - name: 推送
        run: git push origin HEAD:main

      - name: 触发节点检测并等待完成
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run check.yml --repo "${GITHUB_REPOSITORY}" \
            -f max_nodes=0 -f concurrency=32 -f timeout=25
          echo "已触发 check.yml（全量），等待它出现在运行列表里…"

          run_id=""
          for _ in $(seq 1 25); do
            sleep 6
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow=check.yml --limit 8 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"${start}\")][0].databaseId // empty")
            if [ -n "${run_id}" ]; then break; fi
          done

          if [ -z "${run_id}" ]; then
            echo "::error::没等到本次 check.yml 的运行记录"
            exit 1
          fi
          echo "本次运行 ID：${run_id}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

          # 检测失败也继续往下走：合并层会退化成「重跑最近几轮」，仍能筛出存活节点
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 20 \
            || echo "::warning::check.yml 未成功结束，合并层将退回使用已发布结果"

  merge:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 取回前几轮产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.sync.outputs.run_id }}
        run: |
          set -u
          # 从上一次往前数 2 个成功的 check 运行（本轮之外），用于三轮并集
          ids=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow=check.yml --limit 10 \
                  --json databaseId,conclusion \
                  --jq '[.[] | select(.conclusion == "success") | .databaseId] | .[]')
          n=0
          for rid in ${ids}; do
            [ "${rid}" = "${RUN_ID}" ] && continue
            n=$((n + 1))
            [ "${n}" -gt 2 ] && break
            if gh run download "${rid}" --repo "${GITHUB_REPOSITORY}" -n github-pages -D "_rounds/${n}" 2>/dev/null \
               && [ -f "_rounds/${n}/artifact.tar" ]; then
              mkdir -p "_rounds/${n}/public"
              tar -xf "_rounds/${n}/artifact.tar" -C "_rounds/${n}/public"
              echo "第 ${n} 轮（上一轮）取自运行 ${rid}"
            else
              rm -rf "_rounds/${n}"
              echo "::warning::运行 ${rid} 的产物取不到，跳过该轮"
            fi
          done
          ls -R _rounds 2>/dev/null | head -20 || echo "没有历史轮次（首次运行属正常）"

      - name: 取回本轮产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.sync.outputs.run_id }}
        run: |
          set -u
          mkdir -p _art
          if [ -n "${RUN_ID}" ] && gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
               -n github-pages -D _pages 2>/dev/null && [ -f _pages/artifact.tar ]; then
            mkdir -p _art/public
            tar -xf _pages/artifact.tar -C _art/public
            echo "已从 artifact 取到本轮产物（run ${RUN_ID}）"
          else
            echo "::warning::本轮 artifact 取不到，退回使用站点上已发布的结果"
            site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
            mkdir -p _art/public
            curl -sSL --retry 3 "${site}/data.json?t=$(date +%s)" -o _art/public/data.json
            curl -sSL --retry 3 "${site}/index.html?t=$(date +%s)" -o _art/public/index.html || true
          fi
          test -s _art/public/data.json || { echo "::error::拿不到 data.json，无法合并"; exit 1; }
          ls -la _art/public

      - name: 三轮并集 + 回测剔除
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          ARTIFACT_DIR: _art
          ROUNDS_DIR: _rounds
          OUT_DIR: _out
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          MERGE_ROUNDS: '3'
          VERIFY_CONC: '32'
          # 每国上限留空 = 不限：三轮抓到多少、验活多少就发多少，不按国家配额截断
        run: python merge_rounds.py

      - name: 聚合 ProxyIP（判真家宽 + 分地区 + 镜像源）
        continue-on-error: true
        env:
          OUT_DIR: _out
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          VERIFY_CONC: '60'
          # 把拉到的原始源镜像到站点 /src/：国内直连自己的域名就能取源，
          # 不用碰被 SNI 阻断的 raw.githubusercontent.com
          MIRROR_DIR: _out/src
        run: python aggregate_proxyip.py

      - name: 并入本机实测结果（local/）
        run: |
          set -u
          if [ -d local ] && [ -n "$(ls -A local 2>/dev/null)" ]; then
            mkdir -p _out/local
            cp -rf local/. _out/local/
            echo "已并入 local/：$(find _out/local -type f | wc -l) 个文件"
          else
            echo "local/ 为空或不存在，跳过（本机还没跑过 本地拉家宽.py --push）"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _out

      - name: 发布并集结果
        id: deployment
        uses: actions/deploy-pages@v4
